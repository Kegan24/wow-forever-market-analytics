name: Python tests
on:
  push:
    branches: [main, issue-1-validate-ahledger-api]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile dashboard and Python modules
        run: python -m compileall -q app.py market_api.py storage.py check_api.py
      - name: Run offline unit tests
        run: python -m unittest discover -v
